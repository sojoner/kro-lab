{{- if .Values.headlamp.enabled }}
# No tls block: the host already has its certificate (secret ingress-tls) from the Grafana and Dex
# ingresses of the infrastructure chart, and a second certificate would change the CA that the API
# servers trust for Dex.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - pathType: Prefix
            path: {{ .Values.ingress.path }}
            backend:
              service:
                name: {{ .Values.headlamp.fullnameOverride }}
                port:
                  number: {{ .Values.headlamp.service.port }}
{{- end }}

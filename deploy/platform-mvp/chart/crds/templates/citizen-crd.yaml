apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: citizens.agora.platform.example.com
spec:
  group: agora.platform.example.com
  names:
    kind: Citizen
    listKind: CitizenList
    plural: citizens
    singular: citizen
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: OIDC Sub
          type: string
          jsonPath: .spec.oidcSub
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - displayName
                - type
                - oidcSub
              properties:
                displayName:
                  type: string
                type:
                  type: string
                  enum:
                    - Human
                    - Workload
                    - Agent
                oidcSub:
                  type: string
                  description: The OIDC subject identifier
                x509SAN:
                  type: string
                  description: SPIFFE URI for workload identities
                allowedProducts:
                  type: array
                  items:
                    type: string
                  description: Product names this citizen may bind
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                phase:
                  type: string
                  enum:
                    - Pending
                    - Active
                    - Suspended
                    - Deactivated
                lastAuthenticated:
                  type: string
                  format: date-time
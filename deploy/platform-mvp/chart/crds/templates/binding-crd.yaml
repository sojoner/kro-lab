apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bindings.agora.platform.example.com
spec:
  group: agora.platform.example.com
  names:
    kind: Binding
    listKind: BindingList
    plural: bindings
    singular: binding
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Offer
          type: string
          jsonPath: .spec.offerRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - offerRef
                - version
              properties:
                offerRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                acceptedClaims:
                  type: array
                  items:
                    type: object
                    required:
                      - group
                      - resource
                      - verbs
                    properties:
                      group:
                        type: string
                      resource:
                        type: string
                      verbs:
                        type: array
                        items:
                          type: string
                      selector:
                        type: object
                        additionalProperties:
                          type: string
                version:
                  type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                phase:
                  type: string
                  enum:
                    - Pending
                    - Accepted
                    - Active
                    - Revoked
                sealRef:
                  type: string
                credentialSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
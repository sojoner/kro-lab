apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: seals.agora.platform.example.com
spec:
  group: agora.platform.example.com
  names:
    kind: Seal
    listKind: SealList
    plural: seals
    singular: seal
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef.name
        - name: Binding
          type: string
          jsonPath: .spec.bindingRef.name
        - name: Secret
          type: string
          jsonPath: .status.credentialSecretRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - bindingRef
                - tenantRef
                - revocationPolicy
              properties:
                bindingRef:
                  type: object
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                secretNameTemplate:
                  type: string
                  description: Go template for the credential secret name
                tenantRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                revocationPolicy:
                  type: string
                  enum:
                    - Immediate
                    - Graceful
                gracePeriodSeconds:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Sealed
                    - Revoked
                    - Expired
                sealedAt:
                  type: string
                  format: date-time
                revokedAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                credentialSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
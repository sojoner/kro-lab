apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: regionalbucketrequests.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: RegionalBucketRequest
    listKind: RegionalBucketRequestList
    plural: regionalbucketrequests
    singular: regionalbucketrequest
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: MaxSize
          type: string
          jsonPath: .spec.maxSize
        - name: Phase
          type: string
          jsonPath: .status.regions[0].phase
        - name: Endpoint
          type: string
          jsonPath: .status.regions[0].endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [region, maxSize, maxObjects]
              properties:
                region:
                  type: string
                  enum: [us, eu, asia]
                # The tier is fixed once ordered: the quota cannot change.
                maxSize:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: maxSize is immutable
                maxObjects:
                  type: integer
                  minimum: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: maxObjects is immutable
            status:
              type: object
              properties:
                regions:
                  type: array
                  items:
                    type: object
                    properties:
                      region:
                        type: string
                      phase:
                        type: string
                        enum: [Pending, Ready, Unschedulable]
                      bucketName:
                        type: string
                      endpoint:
                        type: string
                      message:
                        type: string

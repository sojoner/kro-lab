ingress:
  enabled: false
  host: bm4080.taildf7067.ts.net

cert-manager:
  enabled: true
  installCRDs: true

dex:
  enabled: true
  namespace: monitoring
  # Empty = https://<ingress.host>/dex. The issuer is stamped into every token and must be the URL
  # the API servers' AuthenticationConfiguration trusts, so it is never the in-cluster Service URL.
  issuer: ""
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.46.1
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  # Lifetime of issued ID tokens (Dex default is 24h). Clients re-authenticate or refresh.
  expiry:
    idTokens: 15m
  # The one public client, for the portal and kubectl alike. Its id is the audience every API server
  # expects (spoke chart authConfiguration.dexIssuer.audiences). Dex accepts only the redirects listed:
  # redirectPaths are appended to https://<ingress.host> (the portal's callback), redirectURIs are
  # kubectl oidc-login's local listeners and its keyboard flow (out of band).
  kubernetesClient:
    id: kubernetes
    name: Kubernetes
    redirectPaths: [/headlamp/oidc-callback]
    redirectURIs: [http://localhost:8000, http://localhost:18000, urn:ietf:wg:oauth:2.0:oob]
  # The connector that answers the password grant (tests, scripts): the static users below.
  passwordConnector: local
  # Secret holding the CA of each workload issuer, one key per caKey (made by `make ensure-dex-upstream-ca`).
  upstreamCaSecret: dex-upstream-ca
  # Clusters whose service-account tokens may be exchanged for Dex tokens (RFC 8693).
  workloadConnectors:
    - id: us-workloads
      name: us workloads
      issuer: https://us-control-plane:6443
      caKey: us.crt
  connectors: []
  # Example multi-IDP connectors:
  # connectors:
  #   - type: oidc
  #     id: acme-corp-okta
  #     name: ACME Corp (Okta)
  #     config:
  #       issuer: https://acme-corp.okta.com
  #       clientID: ${ACME_OKTA_CLIENT_ID}
  #       clientSecret: ${ACME_OKTA_CLIENT_SECRET}
  #   - type: github
  #     id: startup-x-github
  #     name: Startup X (GitHub)
  #     config:
  #       clientID: ${STARTUPX_GITHUB_CLIENT_ID}
  #       clientSecret: ${STARTUPX_GITHUB_CLIENT_SECRET}
  #       orgs:
  #         - startup-x

cronjob:
  schedule: "*/2 * * * *"
  # Test directories (tests/e2e/tests/<name>) the in-cluster runner executes. Only tests
  # that need nothing beyond the hub and us belong here; the full suite is `make validate`.
  # Every name must exist: `make check-runner-tests` (part of `make lint`) enforces it.
  tests:
    - 01-hub-cluster-ready
    - 02-us-cluster-ready
    - 05-fleet-registration
    - 06-observability-stack
    - 07-ingress-log-shipping
    - 08-dashboard-metrics
    - 10-chainsaw-cronjob
    - 11-oidc-trust
    - 12-auth-configuration
    - 13-projected-sa-tokens
    - 14-platform-admin-access
    - 32-management-plane-ready

kube-prometheus-stack:
  enabled: true
  crds:
    enabled: true
  alertmanager:
    enabled: false
  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 2d
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { cpu: 500m, memory: 1Gi }
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      podMonitorSelector: {}
      ruleSelector: {}
      additionalScrapeConfigs: []
  grafana:
    adminPassword: admin
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            url: http://loki.monitoring:3100
            access: proxy
  kube-state-metrics:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 50m, memory: 128Mi }
  nodeExporter:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
  prometheusOperator:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    schemaConfig:
      configs:
        - from: "2025-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
    limits_config:
      max_entries_limit_per_query: 5000
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    podSecurityContext:
      fsGroup: 0
      runAsUser: 0
      runAsNonRoot: false
      runAsGroup: 0
    containerSecurityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  singleBinary:
    replicas: 1
    persistence:
      enabled: false
    extraVolumes:
      - name: loki-tmp
        emptyDir: {}
      - name: loki-data
        emptyDir: {}
    extraVolumeMounts:
      - name: loki-tmp
        mountPath: /var/loki-tmp
      - name: loki-data
        mountPath: /var/loki
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 768Mi }
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  minio:
    enabled: false
  gateway:
    enabled: false
  monitoring:
    dashboards:
      enabled: false
    rules:
      enabled: false
    serviceMonitor:
      enabled: false
    selfMonitoring:
      enabled: false
  test:
    enabled: false

# Kubernetes events to Loki (templates/event-exporter.yaml).
eventExporter:
  # Events older than this when the exporter handles them are dropped (its default is 5).
  maxEventAgeSeconds: 60
  # Skip reading each event's object: the layout uses only fields of the event itself, and the
  # lookup needs read rights on every kind, Secrets included.
  omitLookup: true
  streamLabels:
    job: kubernetes-events

promtail:
  enabled: true
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  config:
    clients:
      - url: http://loki.monitoring:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576
    snippets:
      extraRelabelConfigs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app, __meta_kubernetes_pod_controller_name, __meta_kubernetes_pod_name]
          regex: '^;*([^;]+)(;.*)?$'
          target_label: app
    limits_config:
      max_streams_per_user: 0
      readline_rate_drop: false
    positions:
      filename: /run/promtail/positions.yaml
  tolerations:
    - operator: Exists

ingress-nginx:
  enabled: true
  controller:
    replicaCount: 1
    ingressClassResource:
      name: nginx
      default: false
    service:
      type: ClusterIP
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    kind: Deployment
    resources:
      requests: { cpu: 50m, memory: 90Mi }
      limits: { cpu: 200m, memory: 256Mi }
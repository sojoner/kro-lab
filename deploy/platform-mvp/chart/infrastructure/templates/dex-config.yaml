{{ if .Values.dex.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: {{ .Values.dex.namespace }}
data:
  config.yaml: |
    issuer: {{ .Values.dex.issuer | default (printf "https://%s/dex" .Values.ingress.host) }}
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    expiry:
      idTokens: {{ .Values.dex.expiry.idTokens }}
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      skipApprovalScreen: true
      responseTypes:
        - code
        - token
        - id_token
      passwordConnector: {{ .Values.dex.passwordConnector }}
    staticClients:
      - id: {{ .Values.dex.kubernetesClient.id }}
        name: {{ .Values.dex.kubernetesClient.name }}
        public: true
        redirectURIs:
        {{- range .Values.dex.kubernetesClient.redirectPaths }}
          - https://{{ $.Values.ingress.host }}{{ . }}
        {{- end }}
        {{- range .Values.dex.kubernetesClient.redirectURIs }}
          - {{ . }}
        {{- end }}
    connectors:
{{- range .Values.dex.connectors }}
      - type: {{ .type }}
        id: {{ .id }}
        name: {{ .name }}
        config:
          {{- toYaml .config | nindent 10 }}
{{- end }}
{{- range .Values.dex.workloadConnectors }}
      - type: oidc
        id: {{ .id }}
        name: {{ .name }}
        config:
          issuer: {{ .issuer }}
          rootCAs:
            - /etc/dex/upstream-ca/{{ .caKey }}
          scopes:
            - openid
          userNameKey: sub
          insecureSkipEmailVerified: true
{{- end }}
    enablePasswordDB: true

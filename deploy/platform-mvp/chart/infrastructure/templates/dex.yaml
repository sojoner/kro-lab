{{ if .Values.dex.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: {{ .Values.dex.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dex
rules:
  - apiGroups: ["dex.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dex
subjects:
  - kind: ServiceAccount
    name: dex
    namespace: {{ .Values.dex.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: {{ .Values.dex.namespace }}
  labels:
    app: dex
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5556
      targetPort: 5556
    - name: telemetry
      port: 5558
      targetPort: 5558
  selector:
    app: dex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ .Values.dex.namespace }}
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: dex
      containers:
        - name: dex
          image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"
          imagePullPolicy: {{ .Values.dex.image.pullPolicy }}
          command:
            - dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          volumeMounts:
            - name: config
              mountPath: /etc/dex
            - name: data
              mountPath: /var/dex
            - name: upstream-ca
              mountPath: /etc/dex/upstream-ca
              readOnly: true
          resources:
            {{- toYaml .Values.dex.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: 5556
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /dex/healthz
              port: 5556
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: dex-config
        - name: data
          emptyDir: {}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.dex.upstreamCaSecret }}
            optional: true
{{ end }}
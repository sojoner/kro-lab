# Per-tenant RBAC templates for spoke clusters.
# Creates namespace, 3 role tiers (admin/developer/analyst), and 3 RoleBindings.

{{- range .Values.tenants }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .id }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .id }}-admin
  namespace: {{ .id }}
rules:
{{- if $.Values.kubevirt.enabled }}
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachineinstances/console", "virtualmachineinstances/portforward"]
  verbs: ["get"]
{{- end }}
{{- if $.Values.objectStorage.enabled }}
- apiGroups: ["objectbucket.io"]
  resources: ["objectbucketclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# The claim's Secret holds the S3 credentials: fetched by name, never listed.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .id }}-developer
  namespace: {{ .id }}
rules:
{{- if $.Values.kubevirt.enabled }}
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachineinstances/console", "virtualmachineinstances/portforward"]
  verbs: ["get"]
{{- end }}
{{- if $.Values.objectStorage.enabled }}
- apiGroups: ["objectbucket.io"]
  resources: ["objectbucketclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# The claim's Secret holds the S3 credentials: fetched by name, never listed.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .id }}-analyst
  namespace: {{ .id }}
rules:
{{- if $.Values.kubevirt.enabled }}
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list", "watch"]
{{- end }}
{{- if $.Values.objectStorage.enabled }}
- apiGroups: ["objectbucket.io"]
  resources: ["objectbucketclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .id }}-admin-binding
  namespace: {{ .id }}
subjects:
- kind: Group
  name: dex:{{ .id }}-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .id }}-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .id }}-developer-binding
  namespace: {{ .id }}
subjects:
- kind: Group
  name: dex:{{ .id }}-developer
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .id }}-developer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .id }}-analyst-binding
  namespace: {{ .id }}
subjects:
- kind: Group
  name: dex:{{ .id }}-analyst
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .id }}-analyst
  apiGroup: rbac.authorization.k8s.io
{{- end }}{{- /* Tenants read CRDs, schemas not objects (tenantCrdReadVerbs): the portal's sidebar lists every
       CRD, and its page for a custom resource (VMs, bucket claims) reads the CRD first. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-crd-reader
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: {{ .Values.tenantCrdReadVerbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-crd-reader
subjects:
{{- range .Values.tenants }}
{{- $id := .id }}
{{- range $tier := list "admin" "developer" "analyst" }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: dex:{{ $id }}-{{ $tier }}
{{- end }}
{{- end }}

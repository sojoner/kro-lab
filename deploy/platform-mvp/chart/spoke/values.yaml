authConfiguration:
  enabled: true
  hubIssuer:
    enabled: true
    url: "https://hub-control-plane:6443"
    # Required, set per spoke in values-<name>.yaml: it must equal the audience
    # of the <name>-token projected into the hub controllers that engage the spoke.
    audience: ""
    claimValidationRules:
      - expression: 'claims.sub.startsWith("system:serviceaccount:default:")'
        message: "Only ServiceAccounts from the default namespace on the hub may authenticate."
    claimMappings:
      username:
        claim: sub
        prefix: "hub:"
  dexIssuer:
    enabled: true
    url: "https://bm4080.taildf7067.ts.net/dex"
    audiences:
      - kubernetes
    claimMappings:
      username:
        claim: sub
        prefix: "dex:"
      groups:
        claim: groups
        prefix: "dex:"

oidcVerifier:
  enabled: true
  replicas: 1
  issuer: "https://bm4080.taildf7067.ts.net/dex"
  audience: ""
  insecureSkipVerify: true
  trustJWKS: |
    {
      "keys": [
        {
          "alg": "RS256",
          "e": "AQAB",
          "kid": "test-key-001",
          "kty": "RSA",
          "n": "ujOk4S16brZhQOwEBkOkQZjVSaY78vNcqR_ZyujcmQc3N3Ox1y_vshyF1fZBVYmGtPL93vFdw5NIBYuaVYhGtqUfjBQ4uLFtaLYC00m8oniJiJ0upnr3oqn96aw1tDmYLazd3gw_KQNpB2wIj3_IyIUjGZnVBd6CwrVxe1H87ts5GJwmhQ_1f_WcSE6HmCFdVstZR8lQlyjpTSQmz2G6GLUsDMkpOaCKXzHgjPGVeedLA6CDpJhQX4EJv43xYciao0RFHC8MpGze20Bkk8rOSgmoJqTSQjpquUAjBm0OD-zloYACpwzxPJ_y9VmA9W1qZh17hWpho-x0wPuKdVC0dw",
          "use": "sig"
        }
      ]
    }
  image:
    repository: sojoner/oidc-verifier
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 50m, memory: 64Mi }

admissionPolicies:
  enabled: true
  platformAdminSubjects:
    - kind: Group
      name: dex:platform-admin
  additionalProtectedNamespaces: []

tenants:
  - id: acme-corp
    dexGroups: ["acme-corp-admin", "acme-corp-developer", "acme-corp-analyst"]
  - id: globex-inc
    dexGroups: ["globex-inc-admin", "globex-inc-developer", "globex-inc-analyst"]

# KubeVirt (VMs as a service). Enabled per spoke in values-<name>.yaml; the
# spoke host needs /dev/kvm unless useEmulation is true.
kubevirt:
  enabled: false
  useEmulation: false
  imagePullPolicy: IfNotPresent

# RBAC for the hub's vm-binding-controller on VM-capable spokes. Namespaces
# beyond the tenants (e.g. the fallback namespace) go in extraNamespaces.
vmBindingControllerRBAC:
  enabled: false
  hubIdentity: "hub:system:serviceaccount:default:vm-binding-controller"
  extraNamespaces: [default]

# Object storage (S3 buckets served by Rook/Ceph RGW, installed by
# `make deploy-rook-<spoke>`). Enabled per spoke in values-<name>.yaml; it adds
# the claim/credential read rights to the tenant roles.
objectStorage:
  enabled: false

# RBAC for the hub's bucket-binding-controller on object-storage spokes.
# Namespaces beyond the tenants (e.g. the fallback namespace) go in extraNamespaces.
bucketBindingControllerRBAC:
  enabled: false
  hubIdentity: "hub:system:serviceaccount:default:bucket-binding-controller"
  extraNamespaces: [default]

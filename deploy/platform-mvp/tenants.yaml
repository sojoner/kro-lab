# Single source of truth for tenants and the workload identity that acts for them.
# The Makefile passes this file (-f) to the spoke and hub-services charts. Flux cannot read it
# (a chart only sees its own directory), so flux/hub-helmrelease.yaml carries a copy that
# `make check-tenants` (part of `make lint`) keeps identical.
tenants:
  - id: acme-corp
    dexGroups: ["acme-corp-admin", "acme-corp-developer", "acme-corp-analyst"]
  - id: globex-inc
    dexGroups: ["globex-inc-admin", "globex-inc-developer", "globex-inc-analyst"]

# The service account, in each tenant's namespace on the workload cluster, that may create intents on
# the tenant's behalf. The hub sees it as <userPrefix><connectorId>:system:serviceaccount:<tenant>:<serviceAccount>
# (chart/spoke authConfiguration.dexIssuer.workloadConnectors; connector id = Dex dex.workloadConnectors[].id).
workloadIdentity:
  serviceAccount: platform-provisioner
  connectorId: us-workloads
  userPrefix: "dex:"

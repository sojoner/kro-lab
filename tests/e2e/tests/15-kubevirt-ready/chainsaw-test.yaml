apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubevirt-ready
spec:
  concurrent: false
  description: "KubeVirt is deployed on both VM spokes, eu and us, and runs VMs on hardware virtualization"
  steps:
  - name: KubeVirt is Deployed on a KVM-capable node in eu
    cluster: eu
    try: &kubevirt-ready
    - assert:
        resource:
          apiVersion: kubevirt.io/v1
          kind: KubeVirt
          metadata:
            name: kubevirt
            namespace: kubevirt
          status:
            phase: Deployed
        timeout: 5m
    - assert:
        resource:
          apiVersion: v1
          kind: Node
          metadata:
            labels:
              kubevirt.io/schedulable: "true"
        timeout: 2m
    - script:
        content: |
          EMU=$(kubectl get kubevirt kubevirt -n kubevirt -o jsonpath='{.spec.configuration.developerConfiguration.useEmulation}')
          if [ "$EMU" = "true" ]; then
            echo "FAIL: software emulation is on; VMs must use KVM"
            exit 1
          fi
          echo "OK: useEmulation='${EMU}' (hardware virtualization)"
  - name: KubeVirt is Deployed on a KVM-capable node in us
    cluster: us
    try: *kubevirt-ready

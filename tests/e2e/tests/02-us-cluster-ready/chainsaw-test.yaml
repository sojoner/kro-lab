apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: us-cluster-ready
spec:
  concurrent: false
  description: "us spoke nodes are Ready"
  steps:
  - name: us nodes are Ready
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Node
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    cluster: us

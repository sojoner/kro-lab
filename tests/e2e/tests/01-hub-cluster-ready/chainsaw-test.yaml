apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hub-cluster-ready
spec:
  concurrent: false
  description: "Hub nodes are Ready"
  steps:
  - name: hub nodes are Ready
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Node
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    cluster: hub
